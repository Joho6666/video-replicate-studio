<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>复刻 Studio · 爆款视频拆解工作台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23141414'/%3E%3Cpath d='M12 10l10 6-10 6z' fill='%23fff'/%3E%3C/svg%3E">
  <script>document.documentElement.dataset.theme = localStorage.getItem('studio-theme') || 'light';</script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>

  <aside class="side">
    <a class="brand" href="#/">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 6.5l9 5.5-9 5.5z"/></svg></span>
      <span class="brand-name">复刻 Studio</span>
    </a>
    <a class="btn primary block" href="#/new" id="newBtn"><svg viewBox="0 0 24 24" class="ic"><path d="M12 5v14M5 12h14"/></svg>新建拆解</a>
    <nav class="nav" id="nav">
      <a href="#/" data-nav="home"><svg viewBox="0 0 24 24" class="ic"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>片库</a>
      <a href="#/guide" data-nav="guide"><svg viewBox="0 0 24 24" class="ic"><path d="M5 4h10l4 4v12H5z M14 4v5h5 M8 13h8 M8 17h6"/></svg>使用流程</a>
    </nav>
    <div class="side-sec">最近拆解</div>
    <div class="recent" id="recent"></div>
    <div class="engines-card" id="engines"></div>
  </aside>

  <div class="main">
    <header class="bar">
      <nav class="crumbs" id="crumbs"></nav>
      <div class="bar-right">
        <button class="icon-btn" id="theme" title="切换深浅色" aria-label="切换深浅色">
          <svg viewBox="0 0 24 24" class="ic sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg viewBox="0 0 24 24" class="ic moon"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        </button>
      </div>
    </header>
    <main id="app" class="app"></main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
