<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>复刻 Studio · 爆款视频拆解工作台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23f2601d'/%3E%3Cpath d='M13 10l9 6-9 6z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preload" as="image" href="/assets/hero-valley-golden.webp" type="image/webp">
  <script>document.documentElement.dataset.theme = localStorage.getItem('studio-theme') || 'light';</script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <div class="page-glow" aria-hidden="true"></div>

  <header class="topnav">
    <a class="brand" href="#/"><span class="mark" aria-hidden="true"></span>复刻 Studio</a>
    <nav class="links" id="nav">
      <span class="ind" aria-hidden="true"></span>
      <a href="#/" data-nav="home">首页</a>
      <a href="#/library" data-nav="library">片库</a>
      <a href="#/guide" data-nav="guide">使用教程</a>
    </nav>
    <div class="nav-right">
      <span class="engine-dots" id="engines" title="引擎状态"></span>
      <button class="icon-btn" id="theme" title="切换深浅色" aria-label="切换深浅色">
        <svg viewBox="0 0 24 24" class="ic sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg viewBox="0 0 24 24" class="ic moon"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      </button>
      <a class="btn ink magnetic" data-strength=".2" href="#/new">新建拆解</a>
    </div>
  </header>

  <nav class="crumbs" id="crumbs"></nav>
  <main id="app" class="app"></main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
